org.gradle.jvmargs=-Xmx1024m -XX:MaxMetaspaceSize=256m
org.gradle.parallel=false
org.gradle.workers.max=2
kotlin.daemon.jvm.options=-Xmx512m
android.useAndroidX=true
# This builtInKotlin flag was added automatically by Flutter migrator
android.builtInKotlin=false
# This newDsl flag was added automatically by Flutter migrator
android.newDsl=false

# Fix multi-drive (C: Pub Cache vs D: Project) Kotlin incremental compilation crash on Windows
kotlin.incremental=false
kotlin.incremental.java=false

# Route Gradle cache to D: drive (which has ample free space)
systemProp.gradle.user.home=D:/.gradle

